<script>
document.addEventListener('submit',function(e){
  var f=e.target; if(!f.classList||!f.classList.contains('signup'))return;
  e.preventDefault();
  var b=f.querySelector('button'), em=f.querySelector('input[type=email]'), note=f.nextElementSibling;
  if(!em.value||!em.checkValidity()){em.focus();return}
  b.disabled=true; b.textContent='…';
  var cb='mc'+Date.now(), s=document.createElement('script');
  var q=new URLSearchParams(new FormData(f)).toString();
  var done=function(ok,msg){
    if(ok){f.classList.add('done');em.disabled=true;b.textContent=/confirm/i.test(msg)?'Check your inbox ✓':'You’re in ✓';
      if(note)note.textContent=/confirm/i.test(msg)?'One click in the email and you’re in. Check Junk if it’s not there.':'New music lands in your inbox first.';}
    else{b.disabled=false;b.textContent='Sign up';
      if(note)note.textContent=/already/i.test(msg)?'You’re already on the list ✓':(/too many/i.test(msg)?'Too many tries. Give it a few minutes.':'That didn’t work. Check the address and try again.');}
  };
  window[cb]=function(r){delete window[cb];s.remove();
    if(r.result==='redirect'){b.textContent='One sec…';f.setAttribute('target','_self');HTMLFormElement.prototype.submit.call(f);return}
    done(r.result==='success',r.msg||'')};
  s.onerror=function(){done(false,'')};
  s.src=f.action.replace('/post?','/post-json?')+'&'+q+'&c='+cb;
  document.body.appendChild(s);
});
</script>

    </div>

</section>
<script>(function(){var f=document.getElementById('gk'),i=f.querySelector('input'),b=f.querySelector('button'),m=document.getElementById('gm'),o=document.getElementById('go');f.addEventListener('submit',async function(e){e.preventDefault();b.disabled=true;b.textContent='Unlocking\u2026';m.textContent='';if(!(window.crypto&&crypto.subtle)){m.textContent='This browser can\'t open the Vault. Open the page in Safari or Chrome.';b.disabled=false;b.textContent='Unlock';return}var r;try{r=await fetch('vault/track.enc',{cache:'no-store'});if(!r.ok)throw 0}catch(x){m.textContent='Couldn\'t load. Check your connection and try again.';b.disabled=false;b.textContent='Unlock';return}try{var buf=new Uint8Array(await r.arrayBuffer());var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(i.value),'PBKDF2',false,['deriveKey']);var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:buf.slice(0,16),iterations:600000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);var p=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(16,28)},k,buf.slice(28));var u=URL.createObjectURL(new Blob([p],{type:'audio/mpeg'}));o.querySelector('audio').src=u;o.querySelector('audio').addEventListener('contextmenu',function(ev){ev.preventDefault()});f.hidden=true;o.hidden=false;}catch(err){m.textContent='Not quite. Try again.';b.disabled=false;b.textContent='Unlock';i.select();}});})();</script>
