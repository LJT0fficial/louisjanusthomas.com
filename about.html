<script>
document.addEventListener('submit',function(e){
  var f=e.target; if(!f.classList||!f.classList.contains('signup'))return;
  e.preventDefault();
  var b=f.querySelector('button'), em=f.querySelector('input[type=email]'), note=f.nextElementSibling;
  if(!em.value||!em.checkValidity()){em.focus();return}
  b.disabled=true; b.textContent='…';
  var cb='mc'+Date.now(), s=document.createElement('script');
  var q=new URLSearchParams(new FormData(f)).toString();
  var done=function(ok,msg){
    if(ok){f.classList.add('done');em.disabled=true;b.textContent=/confirm/i.test(msg)?'Check your inbox ✓':'You’re in ✓';
      if(note)note.textContent=/confirm/i.test(msg)?'One click in the email and you’re in. Check Junk if it’s not there.':'New music lands in your inbox first.';}
    else{b.disabled=false;b.textContent='Sign up';
      if(note)note.textContent=/already/i.test(msg)?'You’re already on the list ✓':(/too many/i.test(msg)?'Too many tries. Give it a few minutes.':'That didn’t work. Check the address and try again.');}
  };
  window[cb]=function(r){done(r.result==='success',r.msg||'');delete window[cb];s.remove()};
  s.onerror=function(){done(false,'')};
  s.src=f.action.replace('/post?','/post-json?')+'&'+q+'&c='+cb;
  document.body.appendChild(s);
});
</script>
